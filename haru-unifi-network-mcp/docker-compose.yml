version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: haru-unifi-network-mcp_web_1
      APP_PORT: 3000

  data-init:
    image: busybox:1@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    command: ["sh", "-c", "chmod -R a+rwX /home/umbrel/umbrel/app-data/haru-bifrost/data 2>/dev/null || true"]
    network_mode: none
    restart: "no"
    volumes:
      - /home/umbrel/umbrel/app-data/haru-bifrost/data:/home/umbrel/umbrel/app-data/haru-bifrost/data

  web:
    image: ghcr.io/sirkirby/unifi-network-mcp:latest
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - UNIFI_HOST=192.168.1.1
      - UNIFI_PORT=443
      - UNIFI_VERIFY_SSL=false
      - UNIFI_REDACT_SENSITIVE_FIELDS=true
      - UNIFI_MCP_HTTP_ENABLED=true
      - UNIFI_MCP_HTTP_TRANSPORT=streamable-http
      - UNIFI_MCP_HOST=0.0.0.0
      - UNIFI_MCP_PORT=3000
      - UNIFI_MCP_HTTP_AUTH_TOKEN=${UNIFI_MCP_HTTP_AUTH_TOKEN:-${APP_SEED}}
      - UNIFI_USERNAME=${UNIFI_USERNAME:-mcp-admin}
      - UNIFI_PASSWORD=${UNIFI_PASSWORD:-}
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    networks:
      - default
      - umbrel_main_network

networks:
  umbrel_main_network:
    name: umbrel_main_network
    external: true
