manifestVersion: 1.1
id: haru-unifi-network-mcp
category: developer
name: UniFi Network MCP
version: "1.0.0"
tagline: Model Context Protocol (MCP) server for UniFi Network controllers
description: >-
  UniFi Network MCP provides Model Context Protocol (MCP) tools for inspecting, monitoring, and configuring UniFi Network controllers and gateways, including port forwards, client devices, firewall policies, and network topology.


  Features:

  - Complete port forward inspection and rule management.

  - Client device tracking, status, and network topology mapping.

  - Streamable HTTP MCP transport with token-based authentication.
