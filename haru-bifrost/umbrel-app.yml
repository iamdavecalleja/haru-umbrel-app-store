manifestVersion: 1.1
id: haru-bifrost
category: ai
name: Bifrost
version: "2.4.0"
tagline: Lightweight Go AI Gateway & LLM fallback router
description: >-
  Bifrost is an ultra-fast, lightweight AI gateway written in Go that provides a unified OpenAI-compatible endpoint, intelligent load balancing, and automated fallback routing across Gemini, local Ollama models, Vercel AI Gateway, and cloud model providers.


  Features:

  - Unified OpenAI-compatible API endpoint for all downstream consumers (Home Assistant, Sure, Supermemory, Rakazo).

  - Automatic fallbacks and retry logic to keep AI integrations resilient during upstream provider outages.

  - Low memory footprint and native high-concurrency architecture.
