version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: haru-bifrost_server_1
      APP_PORT: 8080

  server:
    image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    environment:
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - APP_DIR=/app/data
      - LOG_LEVEL=info
      - TZ=UTC
    networks:
      umbrel_main_network:
        aliases:
          - bifrost

networks:
  umbrel_main_network:
    name: umbrel_main_network
    external: true
