name: Rakazo
version: "0.1.0-edge"
tagline: AI teammates you actually own
description: >-
  Rakazo gives you autonomous AI teammates that run entirely on your private infrastructure. Teammates can browse the web, write code, run commands in isolated sandboxes, coordinate over messaging channels, and remember context across sessions.


  Features:

  - Autonomous AI agents executing real work in secure container sandboxes.

  - Deep integration with Bifrost for intelligent model fallback and Supermemory for semantic recall.

  - First-party Composio tool integration, passkey authentication, and OIDC Single Sign-On.
