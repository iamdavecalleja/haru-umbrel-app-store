version: "3.7"

services:
  app:
    image: ghcr.io/recyclarr/recyclarr:8.7.3@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9
    # user: "1000:1000"
    restart: unless-stopped
    environment:
      - TZ=UTC
      - CRON_SCHEDULE=0 3 * * *
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
