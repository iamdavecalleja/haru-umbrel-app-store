# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
################################################################################
## Recyclarr Configuration for Haru Media Stack
## Syncs TRaSH Guides quality profiles, custom formats, and media naming
################################################################################

radarr:
  radarr:
    base_url: !env_var RADARR_URL http://radarr_server_1:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    media_naming:
      folder: plex-tmdb
      movie:
        rename: true
      standard: plex-tmdb

sonarr:
  sonarr:
    base_url: !env_var SONARR_URL http://sonarr_server_1:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    media_naming:
      series: plex-tvdb
      season: default
      episodes:
        rename: true
      standard: plex-tvdb
      daily: default
      anime: default
