version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: haru-supermemory_server_1
      APP_PORT: 6767

  server:
    image: supermemory/supermemory:0.0.9@sha256:557781468b448da518a0d45eacc0ff894bd7847769aa8a20023db2d51d6cef43
    user: "0:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:6768:6767"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    environment:
      - SUPERMEMORY_HOST=0.0.0.0
      - SUPERMEMORY_DATA_DIR=/data
      - SUPERMEMORY_DISABLE_TELEMETRY=1
      - SUPERMEMORY_NO_OPEN=1
      - SUPERMEMORY_NO_UPDATE_CHECK=1
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://bifrost:8080/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gemini-2.5-flash}
      - OPENAI_FAST_MODEL=${OPENAI_FAST_MODEL:-gemini-2.5-flash}
      - TZ=${TZ:-UTC}
      - SUPERMEMORY_API_KEY=${SUPERMEMORY_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key-for-smoke-test}
    networks:
      umbrel_main_network:
        aliases:
          - supermemory

networks:
  umbrel_main_network:
    name: umbrel_main_network
    external: true
