name: Supermemory
version: "0.0.9"
tagline: Self-hosted semantic memory & knowledge graph server
description: >-
  Supermemory is a self-hosted semantic memory and knowledge graph system that organizes, indexes, and queries personal context and memories. It acts as a persistent contextual brain across Rakazo AI teammates, Antigravity, and Home Assistant automations.


  Features:

  - Semantic indexing and retrieval of notes, conversations, and documents.

  - Compatible with Bifrost and local LLMs via unified OpenAI API routing.

  - High-performance vector embeddings and relational graph extraction.
